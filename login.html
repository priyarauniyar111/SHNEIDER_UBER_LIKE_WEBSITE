<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <a href="index.html" class="home-btn" style="position:fixed;top:22px;left:22px;z-index:1000;padding:10px 22px;background:#18181b;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;box-shadow:0 2px 8px #18181b22;transition:background 0.2s;">Home</a>
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
    <form action="login.php" method="POST" class="space-y-4">
        <input type="email" name="email" placeholder="Email" class="w-full p-3 border rounded-md" required>
        <input type="password" name="password" placeholder="Password" class="w-full p-3 border rounded-md" required>
        <button type="submit" class="w-full bg-black text-white p-3 rounded-md hover:bg-gray-800">Login</button>
      </form>
      
    <p class="text-center text-gray-600 mt-4">
      Don't have an account? <a href="signup.html" class="underline">Sign up</a>
    </p>
  </div>
</body>
</html>
