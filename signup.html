<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Sign Up</h2>
    <form action="signup.php" method="POST" class="space-y-4">
        <input type="text" name="name" placeholder="Name" class="w-full p-3 border rounded-md" required>
        <input type="email" name="email" placeholder="Email" class="w-full p-3 border rounded-md" required>
        <input type="password" name="password" placeholder="Password" class="w-full p-3 border rounded-md" required>
        <button type="submit" class="w-full bg-black text-white p-3 rounded-md hover:bg-gray-800">Sign Up</button>
      </form>
      
    <p class="text-center text-gray-600 mt-4">
      Already have an account? <a href="login.html" class="underline">Login</a>
    </p>
  </div>
</body>
</html>
